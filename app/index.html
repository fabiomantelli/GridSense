<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voltcase</title>
  </head>
  <body>
    <!-- Runs before the app mounts so both CSS tokens and canvas-drawn chart
         chrome (lib/theme.ts) agree on the theme from first paint — otherwise
         the page would flash the OS-preference theme before Svelte mounts and
         lib/themeStore's saved preference takes over. `?theme=` (manual
         override for testing) wins over the saved preference; both win over the
         `[data-theme]` attribute being absent, which falls through to the OS
         preference via app.css's media query. -->
    <script>
      (function () {
        var forced = new URLSearchParams(location.search).get('theme');
        var saved = localStorage.getItem('voltcase-theme');
        var theme = forced === 'light' || forced === 'dark' ? forced : saved === 'light' || saved === 'dark' ? saved : null;
        if (theme) {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
